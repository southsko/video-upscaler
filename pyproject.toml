[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-upscaler"
version = "0.1.0"
description = "Free, self-hosted AI video upscaler (open models, GPU-streaming pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "spandrel>=0.4.1",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ccvfi>=0.0.3",
]

# torch/torchvision are intentionally NOT listed here — install the CUDA build
# from the pytorch index first (see README):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128

[project.optional-dependencies]
dev = ["pytest>=8.0"]
extras = ["colorama>=0.4.6", "windows-curses>=2.3; platform_system=='Windows'"]

[project.scripts]
upscale-video = "upscale_video:main"

[tool.setuptools]
py-modules = ["upscale_video", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
